<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    {{ HEAD }}
    <style>
      #__nuxt-cold-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #111827 0%, #064e3b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 100000;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nuxt-ready #__nuxt-cold-loader {
        opacity: 0;
        pointer-events: none;
      }

      .loader-ring {
        position: relative;
        width: 80px;
        height: 80px;
        border: 4px solid rgba(34, 197, 94, 0.15);
        border-radius: 50%;
        border-top-color: #22c55e;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
      }

      .loader-ball {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        animation: bounce-ball 0.8s ease-in-out infinite alternate;
      }

      .loader-text {
        color: rgba(255, 255, 255, 0.8);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 500;
        margin-top: 8px;
      }

      @keyframes spin {
        100% { transform: rotate(360deg); }
      }

      @keyframes bounce-ball {
        0%   { transform: translate(-50%, -50%) scale(1); }
        100% { transform: translate(-50%, -60%) scale(1.1); }
      }
    </style>
  </head>
  <body {{ BODY_ATTRS }}>
    <div id="__nuxt-cold-loader">
      <div class="loader-ring">
        <span class="loader-ball">🏉</span>
      </div>
      <span class="loader-text">Loading your gear...</span>
    </div>

    {{ APP }}
  </body>
</html>
